[project]
name = "crm-mock-backend"
version = "0.1.0"
description = "Local synthetic HTTP responses for CRM interface development"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
